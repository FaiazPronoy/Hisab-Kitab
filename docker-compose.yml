name: docintel

x-backend: &backend
  image: docintel-backend
  env_file: .env
  volumes:
    - storage:/data/storage
    - ./backend/app:/app/app
    - ./backend/config:/app/config
    - ./backend/tests:/app/tests
    - ./scripts:/app/scripts
    - ./eval:/app/eval
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docintel}
      POSTGRES_DB: ${POSTGRES_DB:-docintel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-docintel}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DEV: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 30

  worker:
    <<: *backend
    pull_policy: never
    mem_limit: 2g
    command: celery -A app.workers.celery_app worker -Q ingest,ocr,extract,index --concurrency=2 --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy

  worker-heavy:
    <<: *backend
    pull_policy: never
    mem_limit: 2g
    command: celery -A app.workers.celery_app worker -Q ocr_heavy --concurrency=1 --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *backend
    pull_policy: never
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-local-dev-key}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  redis_data:
