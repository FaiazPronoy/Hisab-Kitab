name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U docintel" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel
      REDIS_URL: redis://localhost:6379/0
      STORAGE_DIR: /tmp/storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../eval ../scripts
      - run: ln -s ../eval eval && ln -s ../scripts scripts
      - run: pytest -q --junitxml=test-results/junit.xml --cov=app --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/test-results

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
